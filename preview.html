<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Air Purifier Card preview</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        font-family: Roboto, system-ui, sans-serif;
        background: #f2f4f7;
        --card-background-color: #fff;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --divider-color: rgba(0, 0, 0, 0.12);
        --secondary-background-color: #e9edf2;
        --primary-color: #03a9f4;
        --text-primary-color: #fff;
        color: var(--primary-text-color);
      }
      air-purifier-card { display: block; width: 360px; }
      .hint { font-size: 13px; color: #727272; }
    </style>
  </head>
  <body>
    <air-purifier-card id="card"></air-purifier-card>
    <p class="hint">Mocked Home Assistant — the toggle, slider and presets all work.</p>

    <!-- Stand-ins for the Home Assistant elements the card uses.
         They need their own shadow DOM: page CSS cannot style elements
         that live inside the card's shadow root. -->
    <script>
      customElements.define(
        "ha-card",
        class extends HTMLElement {
          connectedCallback() {
            if (this.shadowRoot) return;
            this.attachShadow({ mode: "open" }).innerHTML = `
              <style>
                :host {
                  display: block;
                  background: var(--card-background-color, #fff);
                  border-radius: 12px;
                  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
                }
              </style>
              <slot></slot>`;
          }
        }
      );
      customElements.define(
        "ha-icon",
        class extends HTMLElement {
          connectedCallback() {
            if (this.shadowRoot) return;
            const glyph = this.getAttribute("icon") === "mdi:power" ? "⏻" : "❋";
            this.attachShadow({ mode: "open" }).innerHTML = `
              <style>:host { display: inline-grid; place-items: center; font-size: 18px; line-height: 1; }</style>
              <span>${glyph}</span>`;
          }
        }
      );
    </script>

    <!-- plain script, not type="module": the card has no imports and
         modules are blocked when the page is opened over file:// -->
    <script src="./dist/air-purifier-card.js"></script>

    <script>
      const hass = {
        locale: { language: "en" },
        states: {
          "fan.air_purifier_1_pwm_fan": {
            entity_id: "fan.air_purifier_1_pwm_fan",
            state: "on",
            attributes: {
              friendly_name: "Office Air Purifier",
              percentage: 45,
              percentage_step: 1,
            },
          },
          "sensor.air_purifier_1_fan_rpm": {
            state: "1392",
            attributes: { friendly_name: "Fan RPM", unit_of_measurement: "RPM" },
          },
          "sensor.office_air_quality_sensor_pm_summary": {
            state: "3.0",
            attributes: { friendly_name: "PM2.5", unit_of_measurement: "µg/m³" },
          },
        },
        callService(domain, service, data) {
          const fan = hass.states["fan.air_purifier_1_pwm_fan"];
          if (service === "toggle") fan.state = fan.state === "on" ? "off" : "on";
          if (service === "set_percentage") {
            fan.attributes.percentage = data.percentage;
            fan.state = data.percentage > 0 ? "on" : "off";
          }
          fan.attributes = { ...fan.attributes };
          card.hass = hass;
        },
      };

      const card = document.getElementById("card");
      card.setConfig({
        type: "custom:air-purifier-card",
        fan: "fan.air_purifier_1_pwm_fan",
        rpm: "sensor.air_purifier_1_fan_rpm",
        pm25: "sensor.office_air_quality_sensor_pm_summary",
      });
      card.hass = hass;
    </script>
  </body>
</html>
